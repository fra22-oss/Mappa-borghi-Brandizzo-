#results{display:none;margin-top:5px;max-height:38vh;overflow:auto;background:white;border:1px solid #d1d5db;border-radius:12px;box-shadow:0 4px 18px rgba(0,0,0,.16)}

.legend{position:absolute;z-index:20;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border:1px solid #d1d5db;border-radius:15px;padding:8px;box-shadow:0 2px 14px rgba(0,0,0,.16)}

function unproject(x,y,z){const s=256*Math.pow(2,z),lon=x/s*360-180,n=Math.PI-2*Math.PI*y/s,lat=180/Math.PI*Math.atan(Math.sinh(n));return {lat,lon}}
function viewTopLeft(){const c=project(center.lat,center.lon,zoom);return {x:c.x-app.clientWidth/2,y:c.y-app.clientHeight/2}}
function renderTiles(){tiles.innerHTML=''; const tl=viewTopLeft(), br={x:tl.x+app.clientWidth,y:tl.y+app.clientHeight}, minX=Math.floor(tl.x/256)-1,maxX=Math.floor(br.x/256)+1,minY=Math.floor(tl.y/256)-1,maxY=Math.floor(br.y/256)+1,n=Math.pow(2,zoom);let loaded=0,total=0;for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(y<0||y>=n)continue;total++;const img=new Image();img.className='tile';img.alt='';img.draggable=false;const xx=((x%n)+n)%n;img.src=`https://tile.openstreetmap.org/${zoom}/${xx}/${y}.png`;img.style.left=(x*256-tl.x)+'px';img.style.top=(y*256-tl.y)+'px';img.onload=()=>{loaded++; if(loaded>=Math.max(1,Math.floor(total*.3))) status.style.display='none';};img.onerror=()=>{status.textContent='La cartografia stradale non è raggiungibile. Apri il file in Safari con connessione Internet.';status.style.display='block';};tiles.appendChild(img);}}
function renderOverlay(){overlay.innerHTML=''; const tl=viewTopLeft(); const frag=document.createDocumentFragment(); const radius=zoom>=18?7:zoom>=17?6:zoom>=16?5:4; for(const f of DATA.features){if(!active[f.borgo])continue;const p=project(f.lat,f.lon,zoom),x=p.x-tl.x,y=p.y-tl.y;if(x<-20||x>app.clientWidth+20||y<-20||y>app.clientHeight+20)continue;const el=document.createElement('button');el.className='point';el.style.left=x+'px';el.style.top=y+'px';el.style.width=(radius*2)+'px';el.style.height=(radius*2)+'px';el.style.background=COLORS[f.borgo];el.style.opacity=.52;el.style.padding='0';el.style.cursor='pointer';el.dataset.i=String(f.progressivo);el.addEventListener('click',e=>{e.stopPropagation();showPopup(f)});frag.appendChild(el);if(zoom>=18){const t=document.createElement('div');t.className='civic';t.style.left=(x+10)+'px';t.style.top=(y-8)+'px';t.style.color=COLORS[f.borgo];t.textContent=f.civico;frag.appendChild(t);}}
 for(const b of ORDER){if(!active[b]||!DATA.labels[b])continue;const p=project(DATA.labels[b].lat,DATA.labels[b].lon,zoom),x=p.x-tl.x,y=p.y-tl.y;if(x<0||x>app.clientWidth||y<0||y>app.clientHeight)continue;const l=document.createElement('div');l.className='blabel';l.style.left=x+'px';l.style.top=y+'px';l.style.color=COLORS[b];l.textContent=b;frag.appendChild(l);} overlay.appendChild(frag);}
function render(){renderTiles();renderOverlay();}
function setCenterFromPixelDelta(dx,dy){const c=project(center.lat,center.lon,zoom);center=unproject(c.x-dx,c.y-dy,zoom);render();}
function zoomBy(d, anchorX=app.clientWidth/2, anchorY=app.clientHeight/2){const nz=clamp(zoom+d,13,20);if(nz===zoom)return;const tl=viewTopLeft(), before=unproject(tl.x+anchorX,tl.y+anchorY,zoom);zoom=nz;const ap=project(before.lat,before.lon,zoom);const desired={x:ap.x-anchorX+app.clientWidth/2,y:ap.y-anchorY+app.clientHeight/2};center=unproject(desired.x,desired.y,zoom);render();}
function home(){zoom=15;center={lat:45.1779,lon:7.8378};render();}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',3600)}
function showPopup(f){const p=document.getElementById('popup');p.innerHTML=`<strong>${f.via} ${f.civico}</strong><small>${f.borgo}${f.correzione?'<br>'+f.correzione:''}</small>`;p.style.display='block';}
app.addEventListener('pointerdown',e=>{if(e.target.closest('.btn,.chip,#search,#results,#popup'))return;dragging=true;last={x:e.clientX,y:e.clientY};app.setPointerCapture?.(e.pointerId);});
app.addEventListener('pointermove',e=>{if(!dragging||!last)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;last={x:e.clientX,y:e.clientY};const c=project(center.lat,center.lon,zoom);center=unproject(c.x-dx,c.y-dy,zoom);renderTiles();renderOverlay();});
app.addEventListener('pointerup',()=>{dragging=false;last=null});app.addEventListener('pointercancel',()=>{dragging=false;last=null});
app.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1:-1,e.clientX,e.clientY)},{passive:false});
let touches=new Map();
app.addEventListener('touchstart',e=>{for(const t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});if(touches.size===2){const a=[...touches.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}},{passive:true});
app.addEventListener('touchmove',e=>{for(const t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});if(touches.size===2&&pinchStart){const a=[...touches.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(d>pinchStart*1.28){zoomBy(1);pinchStart=d} else if(d<pinchStart*.78){zoomBy(-1);pinchStart=d}}},{passive:true});
app.addEventListener('touchend',e=>{for(const t of e.changedTouches)touches.delete(t.identifier);if(touches.size<2)pinchStart=null},{passive:true});
document.getElementById('plus').addEventListener('click',()=>zoomBy(1));document.getElementById('minus').addEventListener('click',()=>zoomBy(-1));document.getElementById('home').addEventListener('click',home);
document.getElementById('gps').addEventListener('click',()=>{if(!navigator.geolocation){toast('GPS non disponibile in questo visualizzatore. Apri il file in Safari.');return}toast('Cerco la tua posizione…');navigator.geolocation.getCurrentPosition(pos=>{center={lat:pos.coords.latitude,lon:pos.coords.longitude};zoom=18;render();toast(`Posizione trovata · precisione circa ${Math.round(pos.coords.accuracy)} m`);const m=document.createElement('div');const p=project(center.lat,center.lon,zoom),tl=viewTopLeft();m.className='point';m.style.left=(p.x-tl.x)+'px';m.style.top=(p.y-tl.y)+'px';m.style.width='18px';m.style.height='18px';m.style.background='#2563eb';m.style.opacity='1';m.style.border='4px solid white';m.style.boxShadow='0 0 0 2px #2563eb';overlay.appendChild(m);},err=>toast('GPS bloccato dal visualizzatore. Usa Safari e consenti la posizione.'),{enableHighAccuracy:true,timeout:12000,maximumAge:10000})});
const legend=document.getElementById('legendRow');for(const b of ORDER){const bt=document.createElement('button');bt.className='chip';bt.innerHTML=`<span class="dot" style="background:${COLORS[b]}"></span>${b} <small>${DATA.counts[b]||0}</small>`;bt.addEventListener('click',()=>{active[b]=!active[b];bt.classList.toggle('off',!active[b]);renderOverlay()});legend.appendChild(bt)}document.getElementById('all').addEventListener('click',()=>{ORDER.forEach(b=>active[b]=true);document.querySelectorAll('.chip').forEach(x=>x.classList.remove('off'));renderOverlay()});
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim();const search=document.getElementById('search'),results=document.getElementById('results');
function doSearch(){const q=norm(search.value);results.innerHTML='';if(q.length<2){results.style.display='none';return}const parts=q.split(' '),ms=[];for(const f of DATA.features){const h=norm(`${f.via} ${f.civico} ${f.borgo}`);if(parts.every(p=>h.includes(p)))ms.push(f);if(ms.length>=18)break}for(const f of ms){const b=document.createElement('button');b.innerHTML=`<strong>${f.via} ${f.civico}</strong><br><small style="color:${COLORS[f.borgo]}">${f.borgo}</small>`;b.addEventListener('click',()=>{center={lat:f.lat,lon:f.lon};zoom=19;render();showPopup(f);search.value=`${f.via} ${f.civico}`;results.style.display='none'});results.appendChild(b)}results.style.display=ms.length?'block':'none'}search.addEventListener('input',doSearch);app.addEventListener('click',e=>{if(!e.target.closest('#popup,.point,#results,#search'))document.getElementById('popup').style.display='none'});
window.addEventListener('resize',render);render();
</script>
</body></html>
