const COLORS={

"Burg D'An Giù":"#f28e2b",

"Burg D'Le Ca Nove":"#2563eb",

"Burg Orchidea":"#d946ef",
"Burg S. Gervasio":"#2e7d32",
"Burg di Prà Neiva":"#d4a017"
};
const ORDER=Object.keys(COLORS);
const SHORT={
"Burg D'Al Centro":"Centro","Burg D'An Giù":"D'An Giù","Burg D'La Frutera":"Frutera","Burg D'Le Ca Nove":"Ca Nove",
"Burg Di Ciapej":"Ciapej","Burg Orchidea":"Orchidea","Burg S. Gervasio":"S. Gervasio","Burg di Prà Neiva":"Prà Neiva"
};
const active=Object.fromEntries(ORDER.map(x=>[x,true]));
let zoom=15, center={lat:45.177615,lon:7.837737}, dragging=false,last=null;
const app=document.getElementById('app'),tiles=document.getElementById('tiles'),overlay=document.getElementById('overlay'),status=document.getElementById('status');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function project(lat,lon,z){const s=256*2**z,x=(lon+180)/360*s,p=lat*Math.PI/180,y=(1-Math.log(Math.tan(p)+1/Math.cos(p))/Math.PI)/2*s;return{x,y}}
function unproject(x,y,z){const s=256*2**z,lon=x/s*360-180,n=Math.PI-2*Math.PI*y/s,lat=180/Math.PI*Math.atan(Math.sinh(n));return{lat,lon}}
function tl(){const c=project(center.lat,center.lon,zoom);return{x:c.x-app.clientWidth/2,y:c.y-app.clientHeight/2}}
function renderTiles(){
  tiles.innerHTML=''; const a=tl(),b={x:a.x+app.clientWidth,y:a.y+app.clientHeight},minX=Math.floor(a.x/256)-1,maxX=Math.floor(b.x/256)+1,minY=Math.floor(a.y/256)-1,maxY=Math.floor(b.y/256)+1,n=2**zoom;
  let ok=0,total=0;
  for(let x=minX;x<=maxX;x++)for(let y=minY;y<=maxY;y++){if(y<0||y>=n)continue;total++;const img=new Image;img.className='tile';img.alt='';img.draggable=false;img.src=`https://tile.openstreetmap.org/${zoom}/${((x%n)+n)%n}/${y}.png`;img.style.left=x*256-a.x+'px';img.style.top=y*256-a.y+'px';img.onload=()=>{if(++ok>=Math.max(1,Math.floor(total*.25)))status.style.display='none'};img.onerror=()=>{status.textContent='Cartografia non raggiungibile. Controlla la connessione Internet.';status.style.display='block'};tiles.appendChild(img)}
}
function renderOverlay(){

    const e=document.createElement('button');e.className='cover';Object.assign(e.style,{left:x+'px',top:y+'px',width:r*2+'px',height:r*2+'px',background:COLORS[borgo],opacity:zoom>=18?.72:.52});
    e.addEventListener('click',ev=>{ev.stopPropagation();showPopup(f)});frag.appendChild(e);
    if(zoom>=18){const t=document.createElement('div');t.className='civic';t.style.left=(x+10)+'px';t.style.top=(y-8)+'px';t.style.color=COLORS[borgo];t.textContent=civ;frag.appendChild(t)}
  }
  if(zoom<=16){
    for(const b of ORDER){
      const ps=DATA.filter(f=>f[4]===b); if(!ps.length) continue;
      const lat=ps.reduce((s,f)=>s+f[3],0)/ps.length,lon=ps.reduce((s,f)=>s+f[2],0)/ps.length,p=project(lat,lon,zoom),x=p.x-a.x,y=p.y-a.y;
      if(x>0&&x<app.clientWidth&&y>0&&y<app.clientHeight){const lab=document.createElement('div');lab.className='blabel';lab.textContent=SHORT[b];lab.style.left=x+'px';lab.style.top=y+'px';lab.style.color=COLORS[b];frag.appendChild(lab)}
    }
  }
  overlay.appendChild(frag);
}
function render(){renderTiles();renderOverlay()}
function zoomBy(d){zoom=clamp(zoom+d,13,20);render()}
function home(){zoom=15;center={lat:45.177615,lon:7.837737};render()}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3600)}
function showPopup(f){const [via,civ,,,borgo]=f,p=document.getElementById('popup');p.innerHTML=`<strong>${via} ${civ}</strong><small>${borgo}</small>`;p.style.display='block'}

document.getElementById('all').onclick=()=>{ORDER.forEach(b=>active[b]=true);document.querySelectorAll('.chip').forEach(x=>x.classList.remove('off'));renderOverlay()};

search.oninput=()=>{const q=norm(search.value);results.innerHTML='';if(q.length<2)return results.style.display='none';const parts=q.split(' '),ms=[];for(const f of DATA){if(parts.every(p=>norm(`${f[0]} ${f[1]} ${f[4]}`).includes(p)))ms.push(f);if(ms.length>=20)break}
for(const f of ms){const b=document.createElement('button');b.innerHTML=`<strong>${f[0]} ${f[1]}</strong><br><small style="color:${COLORS[f[4]]}">${f[4]}</small>`;b.onclick=()=>{center={lat:f[3],lon:f[2]};zoom=19;render();showPopup(f);results.style.display='none'};results.appendChild(b)}results.style.display=ms.length?'block':'none'};
